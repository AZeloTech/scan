[project]
name = "dewarping"
version = "1.0.0"
description = "Document Image Dewarping Using Text Lines and Line Segments via Classical Methods Only (Without Machine Learning)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "opencv-python-headless==5.0.0.93",
]

[project.scripts]
dewarping = "dewarping.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dewarping"]
